name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: taiki-e/install-action@v2
        with: { tool: 'actionlint@1.7.12' }
      - run: actionlint -shellcheck= -pyflakes=
      - run: npm run version:check
      - run: npm run audit:identity
      - run: npm run check
      - run: npm test
      - run: node --test scripts/release.test.mjs
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: git diff --exit-code
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: taiki-e/install-action@v2
        with: { tool: 'cargo-audit@0.22.2' }
      - run: cargo audit --file src-tauri/Cargo.lock --json > cargo-audit.json
      - run: node scripts/security-audit.mjs cargo-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dependency-security-report, path: cargo-audit.json }
  native:
    uses: ./.github/workflows/native-build.yml
