name: Native packages
on:
  workflow_call:
    inputs:
      signing:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS ARM64, os: macos-15, target: aarch64-apple-darwin, bundles: app }
          - { name: macOS Intel, os: macos-15-intel, target: x86_64-apple-darwin, bundles: app }
          - { name: Windows x64, os: windows-2022, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { name: Linux x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: deb }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential pkg-config patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm ci
      - run: npm run version:check
      - run: cargo test --lib --locked --manifest-path src-tauri/Cargo.toml
      - name: Import Windows signing certificate
        if: inputs.signing && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Windows signing secrets are required' }
          $certPath = Join-Path $env:RUNNER_TEMP 'nyrc-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 | Set-Content 'signing-config.json'
          } finally { Remove-Item $certPath -Force }
      - name: Package candidate
        env:
          SIGNING_REQUESTED: ${{ inputs.signing }}
          APPLE_CERTIFICATE: ${{ inputs.signing && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signing && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.signing && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.signing && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.signing && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signing && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [[ "$SIGNING_REQUESTED" != true ]]; then unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          args=(--ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }})
          if [[ "$SIGNING_REQUESTED" == true && "$RUNNER_OS" == macOS ]]; then
            test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_SIGNING_IDENTITY" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo 'Apple signing and notarization secrets are required'; exit 1; }
          fi
          if [[ "$SIGNING_REQUESTED" == true && "$RUNNER_OS" == Windows ]]; then args+=(--config signing-config.json); fi
          npm run tauri:build -- "${args[@]}" -- --locked
      - name: Verify requested macOS signature and notarization
        if: inputs.signing && runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict src-tauri/target/${{ matrix.target }}/release/bundle/macos/NYRC.app
          xcrun stapler validate src-tauri/target/${{ matrix.target }}/release/bundle/macos/NYRC.app
          spctl --assess --type execute src-tauri/target/${{ matrix.target }}/release/bundle/macos/NYRC.app
      - name: Verify requested Windows signature
        if: inputs.signing && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' | ForEach-Object { if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw 'Invalid installer signature' } }
      - name: Checksums and provenance
        env:
          SIGNING_REQUESTED: ${{ inputs.signing }}
        run: |
          label=unsigned
          if [[ "$SIGNING_REQUESTED" == true && "$RUNNER_OS" != Linux ]]; then label=signed; fi
          npm run release:artifacts -- ${{ matrix.target }} "$label"
      - uses: actions/upload-artifact@v4
        with:
          name: NYRC-${{ matrix.target }}-unsigned
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
