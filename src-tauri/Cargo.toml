[package]
name = "nyrc"
version = "0.2.0"
description = "NYRC — Not Your Regular Companion. A local-first intelligent personal companion."
authors = ["NYRC Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nyrc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
notify = "6.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
once_cell = "1.20"

keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
arboard = { version = "3", default-features = false }
base64 = "0.22"

[dev-dependencies]
tempfile = "3.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
